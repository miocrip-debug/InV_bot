<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InV_bot Terminal VIP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@200;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --black: #050505;
            --card-bg: rgba(255, 255, 255, 0.02);
            --border: rgba(212, 175, 55, 0.2);
        }

        body {
            background-color: var(--black);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .magazine-header {
            padding: 45px 20px 25px;
            text-align: center;
            border-bottom: 0.5px solid var(--border);
            margin-bottom: 35px;
        }

        .magazine-header h1 {
            font-family: 'Inter', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 12px;
            margin: 0;
            font-weight: 700;
            text-transform: uppercase;
            color: white;
        }

        .magazine-header p {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 0.85rem;
            color: var(--gold);
            margin-top: 8px;
            letter-spacing: 2px;
        }

        .main-container {
            padding: 0 25px;
            flex-grow: 1;
        }

        .balance-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 50px 20px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
        }

        .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #888;
            margin-bottom: 20px;
        }

        .amount {
            font-size: 3.8rem;
            font-weight: 200;
            margin: 10px 0;
            letter-spacing: -3px;
            font-family: 'Inter', sans-serif;
        }

        .profit-badge {
            color: var(--gold);
            padding: 8px 0;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-top: 15px;
            border-top: 0.5px solid rgba(255,255,255,0.1);
        }

        .btn-main {
            background: white;
            color: black;
            border: none;
            padding: 20px;
            width: 100%;
            margin-top: 40px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.75rem;
            transition: 0.3s;
        }

        .footer-logo {
            padding: 40px;
            text-align: center;
            opacity: 0.4;
            font-size: 0.6rem;
            letter-spacing: 6px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="magazine-header">
        <h1>InV_bot</h1>
        <p>Private Digital Assets • Edition 2026</p>
    </div>

    <div class="main-container">
        <div class="balance-card">
            <div class="label">Current Valuation</div>
            <div id="balance" class="amount">$1,000.00</div>
            <span class="profit-badge">Verified +1.0% Daily</span>
        </div>

        <button class="btn-main" onclick="Telegram.WebApp.close()">Secure Exit</button>
    </div>

    <div class="footer-logo">
        InV_bot Global Systems
    </div>

    <script>
        const tele = window.Telegram.WebApp;
        tele.expand();
        tele.headerColor = '#050505';

        let currentBalance = 1000.0000;
        setInterval(() => {
            currentBalance += 0.000012; 
            document.getElementById('balance').innerText = `$${currentBalance.toLocaleString('en-US', {minimumFractionDigits: 4, maximumFractionDigits: 4})}`;
        }, 1000);
    </script>
</body>
</html>
