<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InV_bot Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --coinex-green: #00BD9A;
            --coinex-red: #F6465D;
            --bg-main: #12161C;
            --bg-card: #1E2329;
            --text-main: #EAECEF;
            --text-dim: #848E9C;
            --border: #2B3139;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 16px;
            display: flex; flex-direction: column;
            height: 100vh; box-sizing: border-box;
        }

        /* Header con Reloj */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .brand-name { font-size: 1rem; font-weight: 700; color: var(--text-main); letter-spacing: 0.5px; }
        .live-clock { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.8rem; 
            color: var(--coinex-green); 
            background: rgba(0, 189, 154, 0.1); 
            padding: 4px 10px; 
            border-radius: 6px;
            min-width: 80px;
            text-align: center;
        }

        /* Wallet Card */
        .wallet-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        .label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .balance-row { display: flex; align-items: baseline; gap: 8px; }
        .main-balance { font-size: 2.2rem; font-weight: 700; }
        .currency { color: var(--text-dim); font-size: 1rem; }

        /* Botones CoinEx Style */
        .action-row {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
            margin-bottom: 24px;
        }
        .btn-ce {
            border-radius: 8px; border: none; padding: 12px;
            font-weight: 600; font-size: 0.8rem; cursor: pointer;
            transition: 0.2s;
        }
        .btn-deposit { background-color: var(--coinex-green); color: #000; }
        .btn-withdraw { background-color: #2B3139; color: var(--text-main); }
        .btn-reinvest { background-color: rgba(0, 189, 154, 0.1); color: var(--coinex-green); border: 1px solid rgba(0, 189, 154, 0.2); }
        .btn-ce:active { opacity: 0.7; transform: scale(0.98); }

        /* History */
        .section-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; }
        .history-list {
            flex-grow: 1; overflow-y: auto;
            background-color: var(--bg-card);
            border-radius: 12px 12px 0 0;
            padding: 16px; border: 1px solid var(--border);
        }
        .tx-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid var(--border);
        }
        .tx-desc { font-size: 0.85rem; font-weight: 500; margin-bottom: 4px; display: block; }
        .tx-date { font-size: 0.7rem; color: var(--text-dim); font-family: 'JetBrains Mono'; }
        .tx-amount { font-weight: 600; font-size: 0.9rem; font-family: 'JetBrains Mono'; }

        /* Modal */
        #modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-box {
            background: var(--bg-card); border-radius: 16px; padding: 24px;
            width: 85%; border: 1px solid var(--border); text-align: center;
        }
        .modal-input {
            width: 100%; background: var(--bg-main); border: 1px solid var(--border);
            border-radius: 8px; padding: 14px; color: white; font-size: 1.5rem;
            margin: 20px 0; box-sizing: border-box; text-align: center;
        }

        .up { color: var(--coinex-green); }
        .down { color: var(--coinex-red); }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-name">InV_bot</div>
        <div class="live-clock" id="clock">00:00:00</div>
    </div>

    <div class="wallet-card">
        <div class="label">Total Assets</div>
        <div class="balance-row">
            <span class="main-balance" id="balance">1,000.0000</span>
            <span class="currency">USDT</span>
        </div>
        <div style="margin-top: 10px; font-size: 0.75rem; color: var(--coinex-green);">
            Profit Today: +1.24% <span style="margin-left: 5px;">↑</span>
        </div>
    </div>

    <div class="action-row">
        <button class="btn-ce btn-deposit" onclick="openModal('DEPOSIT')">Deposit</button>
        <button class="btn-ce btn-withdraw" onclick="openModal('WITHDRAW')">Withdraw</button>
        <button class="btn-ce btn-reinvest" onclick="openModal('REINVEST')">Re-invest</button>
    </div>

    <div class="section-title">Recent Transactions</div>
    <div class="history-list" id="history-list"></div>

    <div id="modal">
        <div class="modal-box">
            <div id="m-title" style="font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Transaction</div>
            <input type="number" id="m-input" class="modal-input" placeholder="0.00">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <button class="btn-ce btn-withdraw" onclick="closeModal()">Cancel</button>
                <button class="btn-ce btn-deposit" onclick="processAction()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        const tele = window.Telegram.WebApp;
        tele.expand();

        let balance = 1000.0000;
        let activeOp = "";
        let historyData = [
            { name: "Welcome Bonus", time: "2026-03-29 10:00:00", amount: "+5.00", type: "up" }
        ];

        // Reloj en tiempo real
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('es-ES', { hour12: false });
            document.getElementById('clock').innerText = time;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function openModal(op) {
            activeOp = op;
            document.getElementById('m-title').innerText = op;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = historyData.map(tx => `
                <div class="tx-item">
                    <div>
                        <span class="tx-desc">${tx.name}</span>
                        <span class="tx-date">${tx.time}</span>
                    </div>
                    <span class="tx-amount ${tx.type}">${tx.amount}</span>
                </div>
            `).reverse().join('');
        }

        function processAction() {
            const val = parseFloat(document.getElementById('m-input').value);
            if (!val || val <= 0) return;

            const now = new Date();
            const dateStr = now.toISOString().split('T')[0] + " " + now.toLocaleTimeString();
            let newTx = { time: dateStr };

            if (activeOp === 'DEPOSIT') {
                balance += val;
                newTx.name = "USDT Deposit";
                newTx.amount = "+" + val.toFixed(2);
                newTx.type = "up";
            } else if (activeOp === 'WITHDRAW') {
                if (val > balance) return tele.showAlert("Balance insuficiente");
                balance -= val;
                newTx.name = "USDT Withdrawal";
                newTx.amount = "-" + val.toFixed(2);
                newTx.type = "down";
            } else {
                newTx.name = "Re-investment";
                newTx.amount = "DONE";
                newTx.type = "up";
            }

            historyData.push(newTx);
            renderHistory();
            closeModal();
            tele.HapticFeedback.notificationOccurred('success');
        }

        setInterval(() => {
            balance += 0.000015;
            document.getElementById('balance').innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 4, maximumFractionDigits: 4});
        }, 1000);

        renderHistory();
    </script>
</body>
</html>
