<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InV_bot Intelligence</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37; --bg: #000; --card: #111; --border: rgba(212, 175, 55, 0.2);
            --green: #00ff88; --red: #ff4b4b;
        }

        body {
            background-color: var(--bg); color: white; font-family: 'Inter', sans-serif;
            margin: 0; padding: 15px; overflow: hidden; height: 95vh; display: flex; flex-direction: column;
        }

        /* Portfolio */
        .portfolio {
            background: linear-gradient(180deg, #111 0%, #000 100%);
            border: 1px solid var(--border); padding: 30px; text-align: center; border-radius: 8px; margin-bottom: 15px;
        }
        .balance-value { font-size: 2.5rem; font-family: 'JetBrains Mono'; margin: 5px 0; color: white; }

        /* Botones de Filtro (Historial) */
        .history-controls {
            display: flex; gap: 8px; margin-bottom: 15px; padding-bottom: 5px; overflow-x: auto;
        }
        .filter-btn {
            background: #111; border: 1px solid #222; color: #888;
            padding: 8px 15px; border-radius: 20px; font-size: 0.65rem;
            text-transform: uppercase; font-weight: 700; white-space: nowrap;
        }
        .filter-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(212, 175, 55, 0.05); }

        /* Lista de Historial */
        .history-container {
            flex-grow: 1; background: #080808; border: 1px solid #111;
            border-radius: 8px; padding: 15px; overflow-y: auto;
        }
        .tx-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid #111;
        }
        .tx-info { display: flex; flex-direction: column; gap: 4px; }
        .tx-title { font-size: 0.8rem; font-weight: 600; }
        .tx-date { font-size: 0.6rem; color: #555; font-family: 'JetBrains Mono'; }
        .tx-amount { font-family: 'JetBrains Mono'; font-size: 0.85rem; font-weight: 700; }

        /* Clases de estado */
        .type-profit { color: var(--green); }
        .type-out { color: var(--red); }
        .type-in { color: var(--gold); }

        /* Botones Acción Principal */
        .main-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn {
            padding: 15px; border-radius: 6px; font-weight: 800; font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 1px; border: none; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="portfolio">
        <div style="font-size: 0.6rem; letter-spacing: 2px; color: var(--gold);">AVAILABLE BALANCE</div>
        <div class="balance-value" id="balance">$1,000.0000</div>
    </div>

    <div class="history-controls">
        <button class="filter-btn active" onclick="filterHistory('ALL', this)">All Logs</button>
        <button class="filter-btn" onclick="filterHistory('PROFIT', this)">Profits</button>
        <button class="filter-btn" onclick="filterHistory('DEPOSIT', this)">Deposits</button>
        <button class="filter-btn" onclick="filterHistory('WITHDRAW', this)">Withdrawals</button>
    </div>

    <div class="history-container" id="history-list">
        </div>

    <div class="main-actions">
        <button class="btn" style="background: var(--gold); color: black;">Deposit</button>
        <button class="btn" style="background: #111; color: white; border: 1px solid #333;" onclick="Telegram.WebApp.close()">Exit</button>
    </div>

    <script>
        const tele = window.Telegram.WebApp;
        tele.expand();

        // Datos de ejemplo para el historial
        const transactions = [
            { title: "Scalping Profit", date: "29 MAR 12:00", amount: "+$12.40", type: "PROFIT" },
            { title: "External Deposit", date: "28 MAR 18:30", amount: "+$500.00", type: "DEPOSIT" },
            { title: "Account Withdrawal", date: "27 MAR 09:15", amount: "-$50.00", type: "WITHDRAW" },
            { title: "Daily Yield", date: "27 MAR 00:00", amount: "+$10.00", type: "PROFIT" },
            { title: "Alpha Bonus", date: "26 MAR 14:20", amount: "+$5.00", type: "PROFIT" }
        ];

        function renderHistory(filter = 'ALL') {
            const list = document.getElementById('history-list');
            list.innerHTML = "";
            
            const filtered = filter === 'ALL' ? transactions : transactions.filter(t => t.type === filter);
            
            filtered.forEach(tx => {
                const amountClass = tx.type === 'WITHDRAW' ? 'type-out' : (tx.type === 'PROFIT' ? 'type-profit' : 'type-in');
                list.innerHTML += `
                    <div class="tx-card">
                        <div class="tx-info">
                            <span class="tx-title">${tx.title}</span>
                            <span class="tx-date">${tx.date}</span>
                        </div>
                        <span class="tx-amount ${amountClass}">${tx.amount}</span>
                    </div>
                `;
            });
        }

        function filterHistory(type, btn) {
            // Cambiar estado activo de los botones
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Renderizar con filtro
            renderHistory(type);
            tele.HapticFeedback.selectionChanged();
        }

        // Inicializar
        renderHistory();

        // Crecimiento visual del balance
        let balance = 1000.00;
        setInterval(() => {
            balance += 0.000022;
            document.getElementById('balance').innerText = `$${balance.toLocaleString('en-US', {minimumFractionDigits: 4, maximumFractionDigits: 4})}`;
        }, 1000);
    </script>
</body>
</html>
