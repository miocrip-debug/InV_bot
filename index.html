<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InV_bot x CoinEx Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --coinex-green: #00BD9A;
            --coinex-red: #F6465D;
            --bg-main: #12161C;
            --bg-card: #1E2329;
            --text-main: #EAECEF;
            --text-dim: #848E9C;
            --border: #2B3139;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 16px;
            display: flex; flex-direction: column;
            height: 100vh; box-sizing: border-box;
        }

        /* Header Estilo Exchange */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .user-id { font-size: 0.85rem; font-weight: 600; color: var(--text-main); }
        .market-status { font-size: 0.7rem; color: var(--coinex-green); background: rgba(0, 189, 154, 0.1); padding: 4px 8px; border-radius: 4px; }

        /* Wallet Card */
        .wallet-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        .label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 8px; }
        .balance-row { display: flex; align-items: baseline; gap: 8px; }
        .main-balance { font-size: 2.2rem; font-weight: 700; font-family: 'Inter'; }
        .currency { color: var(--text-dim); font-size: 1rem; }

        /* Actions - Estilo Botones CoinEx */
        .action-row {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
            margin-bottom: 24px;
        }
        .btn-ce {
            border-radius: 8px; border: none; padding: 12px;
            font-weight: 600; font-size: 0.8rem; cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-deposit { background-color: var(--coinex-green); color: #000; }
        .btn-withdraw { background-color: #2B3139; color: var(--text-main); }
        .btn-reinvest { background-color: rgba(0, 189, 154, 0.15); color: var(--coinex-green); }

        /* History List */
        .section-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; color: var(--text-main); }
        .history-list {
            flex-grow: 1; overflow-y: auto;
            background-color: var(--bg-card);
            border-radius: 12px 12px 0 0;
            padding: 16px; border: 1px solid var(--border); border-bottom: none;
        }
        .tx-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid var(--border);
        }
        .tx-desc { font-size: 0.85rem; font-weight: 500; margin-bottom: 4px; display: block; }
        .tx-date { font-size: 0.7rem; color: var(--text-dim); }
        .tx-amount { font-weight: 600; font-size: 0.9rem; }

        /* Modal Estilo CoinEx */
        #modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-box {
            background: var(--bg-card); border-radius: 16px; padding: 24px;
            width: 85%; border: 1px solid var(--border);
        }
        .modal-input {
            width: 100%; background: var(--bg-main); border: 1px solid var(--border);
            border-radius: 8px; padding: 14px; color: white; font-size: 1.2rem;
            margin: 16px 0; box-sizing: border-box; outline: none;
        }
        .modal-input:focus { border-color: var(--coinex-green); }

        .up { color: var(--coinex-green); }
        .down { color: var(--coinex-red); }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-id">Sibanicú Terminal</div>
        <div class="market-status">Market Open</div>
    </div>

    <div class="wallet-card">
        <div class="label">Total Equity Value (USDT)</div>
        <div class="balance-row">
            <span class="main-balance" id="balance">1,000.0000</span>
            <span class="currency">USDT</span>
        </div>
        <div style="margin-top: 10px; font-size: 0.75rem; color: var(--coinex-green);">
            ≈ $1,000.00 USD <span style="margin-left: 5px;">↑ 1.24%</span>
        </div>
    </div>

    <div class="action-row">
        <button class="btn-ce btn-deposit" onclick="openModal('DEPOSIT')">Deposit</button>
        <button class="btn-ce btn-withdraw" onclick="openModal('WITHDRAW')">Withdraw</button>
        <button class="btn-ce btn-reinvest" onclick="openModal('REINVEST')">Re-invest</button>
    </div>

    <div class="section-title">Asset History</div>
    <div class="history-list" id="history-list">
        </div>

    <div id="modal">
        <div class="modal-box">
            <div id="m-title" style="font-weight: 600; font-size: 1rem;">Transaction</div>
            <input type="number" id="m-input" class="modal-input" placeholder="Min. 10.00" inputmode="decimal">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <button class="btn-ce btn-withdraw" onclick="closeModal()">Cancel</button>
                <button class="btn-ce btn-deposit" onclick="processAction()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        const tele = window.Telegram.WebApp;
        tele.expand();
        tele.headerColor = '#12161C';

        let balance = 1000.0000;
        let activeOp = "";
        let historyData = [
            { name: "Daily Staking Reward", time: "2026-03-29 10:00", amount: "+4.20", type: "up" },
            { name: "System Deposit", time: "2026-03-28 15:45", amount: "+1,000.00", type: "up" }
        ];

        function openModal(op) {
            activeOp = op;
            document.getElementById('m-title').innerText = op + " USDT";
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = historyData.map(tx => `
                <div class="tx-item">
                    <div>
                        <span class="tx-desc">${tx.name}</span>
                        <span class="tx-date">${tx.time}</span>
                    </div>
                    <span class="tx-amount ${tx.type}">${tx.amount}</span>
                </div>
            `).reverse().join('');
        }

        function processAction() {
            const val = parseFloat(document.getElementById('m-input').value);
            if (!val || val <= 0) return;

            const now = new Date();
            const timeStr = now.toISOString().slice(0, 16).replace('T', ' ');
            let newTx = { time: timeStr };

            if (activeOp === 'DEPOSIT') {
                balance += val;
                newTx.name = "USDT Deposit";
                newTx.amount = "+" + val.toFixed(2);
                newTx.type = "up";
            } else if (activeOp === 'WITHDRAW') {
                if (val > balance) return tele.showAlert("Balance insuficiente");
                balance -= val;
                newTx.name = "USDT Withdrawal";
                newTx.amount = "-" + val.toFixed(2);
                newTx.type = "down";
            } else {
                newTx.name = "Re-investment";
                newTx.amount = "Done";
                newTx.type = "up";
            }

            historyData.push(newTx);
            renderHistory();
            closeModal();
            tele.HapticFeedback.impactOccurred('medium');
        }

        setInterval(() => {
            balance += 0.000012;
            document.getElementById('balance').innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 4, maximumFractionDigits: 4});
        }, 1000);

        renderHistory();
    </script>
</body>
</html>
