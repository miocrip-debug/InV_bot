<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MiniApp de Inversión</title>

<!-- Telegram MiniApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        background: #0d0d0d;
        color: #f5f5f5;
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 20px;
    }

    .fade-in {
        animation: fadeIn .4s ease forwards;
        opacity: 0;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    .card {
        background: #1a1a1a;
        padding: 20px;
        border-radius: 14px;
        margin-bottom: 20px;
    }

    .balance {
        font-size: 32px;
        font-weight: bold;
    }

    .profit {
        color: #00e676;
        margin-top: 5px;
    }

    .btn {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        margin-top: 12px;
        font-size: 16px;
        border: none;
        cursor: pointer;
        transition: transform .1s ease;
    }

    .btn:active { transform: scale(.96); }

    .btn-primary { background: #00e676; color: #000; }
    .btn-secondary { background: #1a1a1a; border: 1px solid #333; color: #fff; }

    canvas { margin-top: 20px; }
</style>
</head>

<body class="fade-in">

<h2 id="username">Hola</h2>

<div class="card">
    <h3>Balance total</h3>
    <p class="balance" id="balance">$0.00</p>
    <p class="profit" id="profit">+0% este mes</p>
</div>

<canvas id="chart" height="180"></canvas>

<button class="btn btn-primary" onclick="deposit()">Depositar</button>
<button class="btn btn-secondary" onclick="withdraw()">Retirar</button>

<script>
    // Inicializar Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Mostrar nombre del usuario
    const user = tg.initDataUnsafe?.user;
    document.getElementById("username").innerText = "Hola, " + (user?.first_name || "inversionista");

    // Simulación de datos (luego se conectan al backend real)
    document.getElementById("balance").innerText = "$1,250.32";
    document.getElementById("profit").innerText = "+12.4% este mes";

    // Gráfico animado
    const ctx = document.getElementById("chart");
    new Chart(ctx, {
        type: "line",
        data: {
            labels: ["1", "2", "3", "4", "5", "6"],
            datasets: [{
                data: [1000, 1020, 1040, 1080, 1100, 1250],
                borderColor: "#00e676",
                borderWidth: 2,
                tension: 0.3
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            animation: { duration: 800 },
            scales: { x: { display: false }, y: { display: false } }
        }
    });

    // Acciones
    function deposit() {
        tg.showAlert("Función de depósito conectada al backend.");
    }

    function withdraw() {
        tg.showAlert("Función de retiro conectada al backend.");
    }
</script>

</body>
</html>
