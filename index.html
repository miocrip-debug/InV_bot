<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InV_bot Terminal Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --bg: #000;
            --card: #111;
            --border: rgba(212, 175, 55, 0.3);
            --green: #00ff88;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 20px;
            overflow: hidden;
            display: flex; flex-direction: column; height: 95vh;
        }

        /* Dashboard Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-family: 'JetBrains Mono'; color: var(--gold); font-weight: 800; font-size: 0.9rem; }
        
        /* Portfolio Display */
        .portfolio {
            background: linear-gradient(180deg, #111 0%, #000 100%);
            border: 1px solid var(--border);
            padding: 35px 20px; text-align: center; border-radius: 8px;
            margin-bottom: 20px;
        }
        .balance-label { font-size: 0.6rem; letter-spacing: 3px; color: #666; text-transform: uppercase; }
        .balance-value { font-size: 2.8rem; font-family: 'JetBrains Mono'; margin: 10px 0; font-weight: 400; }

        /* Grid Actions */
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .btn {
            background: var(--card); border: 1px solid #333; color: white;
            padding: 18px; border-radius: 6px; font-weight: 800; font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 1px; transition: 0.2s;
        }
        .btn-gold { background: var(--gold); color: black; border: none; }
        .btn:active { transform: scale(0.96); opacity: 0.8; }

        /* Transaction Modal (OCULTO POR DEFECTO) */
        #modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: #111; border: 1px solid var(--gold);
            padding: 30px; width: 80%; border-radius: 12px; text-align: center;
        }
        .modal-title { font-size: 1rem; margin-bottom: 20px; letter-spacing: 2px; color: var(--gold); }
        input {
            width: 100%; background: #000; border: 1px solid #333;
            padding: 15px; color: white; font-family: 'JetBrains Mono';
            font-size: 1.2rem; text-align: center; margin-bottom: 20px; box-sizing: border-box;
        }
        .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* History */
        .history { flex-grow: 1; background: #080808; border: 1px solid #111; padding: 15px; border-radius: 6px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; font-size: 0.75rem; padding: 10px 0; border-bottom: 1px solid #111; }
        .plus { color: var(--green); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">InV_bot // TERMINAL</div>
        <div style="font-size: 0.6rem; color: var(--green);">● SYSTEM ONLINE</div>
    </div>

    <div class="portfolio">
        <div class="balance-label">TOTAL EQUITY (USDT)</div>
        <div class="balance-value" id="balance">$1,000.0000</div>
        <div style="font-size: 0.6rem; color: var(--gold);">VIP LEVEL: ALPHA 1</div>
    </div>

    <div class="actions">
        <button class="btn btn-gold" onclick="openModal('DEPOSIT')">Deposit</button>
        <button class="btn" onclick="openModal('WITHDRAW')">Withdraw</button>
    </div>

    <div class="history">
        <div style="font-size: 0.6rem; color: #444; margin-bottom: 10px; letter-spacing: 1px;">RECENT LOGS</div>
        <div class="history-item"><span>System Yield (Auto)</span><span class="plus">+$10.00</span></div>
        <div class="history-item"><span>Welcome Bonus</span><span class="plus">+$5.00</span></div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">OPERATION</div>
            <input type="number" id="amount-input" placeholder="0.00" step="0.01">
            <div class="modal-btns">
                <button class="btn" style="padding: 12px;" onclick="closeModal()">Cancel</button>
                <button class="btn-gold" style="padding: 12px; border-radius: 6px;" onclick="executeAction()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        const tele = window.Telegram.WebApp;
        tele.expand();

        let currentBalance = 1000.0000;
        let activeAction = "";

        function openModal(action) {
            activeAction = action;
            document.getElementById('modal-title').innerText = action;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('amount-input').value = "";
        }

        function executeAction() {
            const val = parseFloat(document.getElementById('amount-input').value);
            if (isNaN(val) || val <= 0) {
                tele.showAlert("Por favor, ingresa un monto válido.");
                return;
            }

            if (activeAction === 'WITHDRAW' && val > currentBalance) {
                tele.showAlert("Saldo insuficiente.");
                return;
            }

            // Simulación de impacto en balance
            if (activeAction === 'DEPOSIT') currentBalance += val;
            if (activeAction === 'WITHDRAW') currentBalance -= val;

            tele.showConfirm(`¿Confirmar ${activeAction} de $${val}?`, (ok) => {
                if (ok) {
                    closeModal();
                    tele.HapticFeedback.notificationOccurred('success');
                }
            });
        }

        // Crecimiento pasivo visual
        setInterval(() => {
            currentBalance += 0.000018;
            document.getElementById('balance').innerText = `$${currentBalance.toLocaleString('en-US', {minimumFractionDigits: 4, maximumFractionDigits: 4})}`;
        }, 1000);
    </script>
</body>
</html>
